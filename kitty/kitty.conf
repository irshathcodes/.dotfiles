kitty_mod super

allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# kitty.app is started by launchd, so it inherits a bare PATH
# (/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin) — the dirs .zshrc adds are
# missing. Without this, `launch nvim` / `launch claude` in a session file fail
# with "not found" (they exec directly, not through the shell).
env PATH=/opt/homebrew/bin:/Users/irshath/.local/bin:${PATH}

font_family      Hack Nerd Font Mono
font_size        20.0

cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
pixel_scroll yes

# Repaint cap: default 10ms = ~100fps, just under this 120Hz panel. 8ms lets
# continuous scrolling hit the full 120fps. Costs a little GPU only while actively
# scrolling/animating; nothing when the screen is idle.
repaint_delay 8


initial_window_width  100c
initial_window_height 30c
remember_window_size  yes
window_padding_width  6 6 0 6
modify_font cell_height 120%

hide_window_decorations titlebar-only
macos_show_window_title_in none
macos_option_as_alt yes


tab_bar_style custom
tab_bar_filter session:. or session:^$
tab_title_template "{index}. {fmt.fg.tab}{title}"

enable_audio_bell no

scrollback_pager nvim --cmd 'let g:open_mode = 1' --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'set nomodified readonly nolist' +'TermHl' +'$' -

scrollback_lines 10000
tab_bar_min_tabs 1


# mappings start
# cmd+j is the leader for session switching. Sessions are plain kitty session
# files in ~/.local/state/kitty/sessions/ (seeded from kitty/sessions/ in the
# dotfiles repo by install.sh). Everything runs locally on this Mac.
map --new-mode tmux_mode --on-action end kitty_mod+j
map --mode tmux_mode esc pop_keyboard_mode
map --mode tmux_mode b goto_session ~/.local/state/kitty/sessions/buildkit.kitty-session
map --mode tmux_mode u goto_session ~/.local/state/kitty/sessions/ui.kitty-session
map --mode tmux_mode d goto_session ~/.local/state/kitty/sessions/default.kitty-session
map --mode tmux_mode [ goto_session -1

map --mode tmux_mode / kitten ~/.dotfiles/kitty/picker.py sessions
map --mode tmux_mode o kitten ~/.dotfiles/kitty/new_session.py

startup_session ~/.local/state/kitty/sessions/default.kitty-session

# --- new/close/save ---
# *_with_cwd so a new window/tab joins the ACTIVE session (plain new_window
# would create one outside it, which the session-filtered tab bar then hides).
map kitty_mod+enter    new_window_with_cwd
map kitty_mod+t        new_tab_with_cwd
map kitty_mod+shift+w  close_window
map kitty_mod+w        close_tab
# Persist the current tabs/splits/layouts/cwds over the active session's own
# file. --save-only skips opening it in an editor; --use-foreground-process also
# records the program running in each pane (nvim, claude, dev server) so a cold
# start brings them back. Only saves what you explicitly ask it to, so don't
# press this while something destructive is running in a pane.
map kitty_mod+shift+s  save_as_session --save-only --use-foreground-process --match=session:. .
map kitty_mod+k command_palette
map --new-mode layout_mode --on-action end kitty_mod+l
map --mode layout_mode esc pop_keyboard_mode
map --mode layout_mode v goto_layout vertical
map --mode layout_mode h goto_layout horizontal
map --mode layout_mode g goto_layout grid
map --mode layout_mode t goto_layout tall
map --mode layout_mode s goto_layout stack
map kitty_mod+shift+l toggle_layout stack
map kitty_mod+shift+t kitten ~/.dotfiles/kitty/picker.py splits
map kitty_mod+shift+o focus_visible_window
# toggle the Claude agent panel as a right-side split in the active tab
map kitty_mod+a kitten ~/.dotfiles/kitty/agent_panel_toggle.py


map --new-mode scroll_mode --on-unknown end kitty_mod+shift+.
map --mode scroll_mode esc pop_keyboard_mode

map --mode scroll_mode k scroll_line_up 
map --mode scroll_mode j scroll_line_down

map kitty_mod+h show_scrollback
map super+right send_text all \x05
map super+left send_text all \x01
map super+backspace send_text all \x15
map --mode tmux_mode , set_tab_title
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+5 goto_tab 5
map super+6 goto_tab 6
map super+7 goto_tab 7
map super+8 goto_tab 8
# always go to the last tab 
map super+9 goto_tab 100
map shift+enter send_text all \x1b\r
# mappings end


include current-theme.conf
